defaults:
  - _self_
  - pretrain: pretrain
  - finetune@finetune.canc_type_class: canc_type_class
  - finetune@finetune.canc_type_class_33: canc_type_class_33
  - finetune@finetune.deconv: deconv
  - finetune@finetune.surv_pred: surv_pred
  - finetune@finetune.surv_pred_survboard: surv_pred_survboard
  - finetune@finetune.surv_pred_binary: surv_pred_binary
  - finetune@finetune.disease_class: disease_class
  - finetune@finetune.gene_essent: gene_essent
  - finetune@finetune.drug_resp: drug_resp
  - finetune@finetune.batch_integration: batch_integration
  - finetune@finetune.cell_type_annotation: cell_type_annotation

task: pretrain

# Storage root containing datasets/, output/, and other/ (external models).
# The default preserves the existing layout with scbFM/ beside these folders.
root_dir: ${scbfm_root:}
repo_dir: ${scbfm_repo:}
output_dir: ${oc.env:SCBFM_OUTPUT_DIR,${root_dir}/output}

hydra:
  job:
    chdir: false
  run:
    dir: ${output_dir}/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${output_dir}/hydra/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
