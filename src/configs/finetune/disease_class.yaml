# Pretrained model checkpoints (all four required)
pretrained_model_paths:
  pretrain_sc:
  pretrain_bulk:
  preadapt_sc:
  preadapt_bulk:

# DiSignAtlas h5ad (generated by data/notebooks/disignatlas.ipynb)
disignatlas_data_path: /cluster/work/boeva/eheiss/datasets/DiSignAtlas/disignatlas.h5ad

# Disease label column in adata.obs
disease_label_col: label      # obs column containing the disease class label
binary_label_col: binary_label

# Raw values are aligned here; the selected 1,199-gene sequence is quantile-binned
# deterministically inside each DataLoader worker.
gene_list_path: ../data/gene_list.txt
preprocess: true
min_genes: 200
# Fold-level HVGs are fitted on training data and reused for training and
# evaluation. Their count comes from pretrain.selected_gene_count (1199).
hvg_flavor: cell_ranger
hvg_batch_key:
use_cls: true
# Explicitly use CLS concatenated with mean-pooled gene-token embeddings.
# This overrides the legacy use_cls switch in the shared classification head.
head_pooling: mean_cls
# Slightly larger classification head for the multi-class disease task:
# 2 * embsize -> 512 -> 256 -> n_classes.
head_hidden_dim: 512
head_bottleneck_dim: 256

# Finetuning mode
finetune_mode: head_only       # head_only | adapters | full_ft
burn_in_epochs: 3
adapter_bottleneck_dim: 32
adapter_dropout: 0.0
adapter_learning_rate: 1e-4
adapter_after_attention: true
adapter_after_ff: true

# Training
cv_folds: 5
epochs: 20
batch_size: 4
num_workers: 2
prefetch_factor: 2
grad_accumulation_steps: 4
# 1.0 uses inverse-frequency balanced cross-entropy.
class_weight_power: 1.0
head_learning_rate: 1e-4
backbone_learning_rate: 1e-4
max_grad_norm: 1e6
random_seed: 42

# Scheduler
first_cycle_steps: 20
cycle_mult: 1
min_lr: 1e-6
min_lr_ratio:
warmup_steps: 5
gamma: 1.0
