# Pretrained model checkpoints (all four required)
pretrained_model_paths:
  pretrain_sc: ${output_dir}/pretrain_sc/pretrain_sc.pth
  pretrain_bulk: ${output_dir}/pretrain_bulk/pretrain_bulk.pth
  preadapt_sc: ${output_dir}/preadapt_sc/preadapt_sc.pth
  preadapt_bulk: ${output_dir}/preadapt_bulk/preadapt_bulk.pth
# Optional subset of pretrain_sc, pretrain_bulk, preadapt_sc, preadapt_bulk,
# and random_init. Null preserves the standard run over all five models.
model_keys:
# Reuse only fully completed model states from an interrupted run after strict
# validation of its folds, optimization settings, and output artifacts.
resume_completed_models: false

# Data paths
expression_data_path: ${root_dir}/datasets/GDSC/gdsc.h5ad
ic50_data_path: ${root_dir}/datasets/GDSC/drug_response_prediction_IC50.csv
drug_features_path: ${root_dir}/datasets/GDSC/drug_features.npz
gene_info_path:             # only needed when expression_data_path is a CSV; defaults to scbFM/data/bulkformer_gene_info.csv

# Column names in IC50 CSV
model_id_col: ModelID
drug_id_col: Drug ID
ic50_col: IC50
dataset_col: Dataset Version

# Raw values are aligned here; the selected 1,199-gene sequence is quantile-binned
# deterministically for each cell line.
gene_list_path: ${repo_dir}/data/gene_list.txt
preprocess: true
# Fold-level gene selection ranks genes by median absolute deviation across
# distinct training-fold cell lines and reuses the selected genes for evaluation.
hvg_selection_method: mad

# Finetuning mode
finetune_mode: head_only       # head_only | adapters | full_ft
output_suffix: ""
burn_in_epochs: 3
adapter_bottleneck_dim: 32
adapter_dropout: 0.0
adapter_learning_rate: 1e-4
adapter_after_attention: true
adapter_after_ff: true

# Fusion head: CancerFoundation CLS sample embedding concatenated with the KPGT
# drug embedding, then an MLP predicts IC50.
head_hidden_dim: 512
head_bottleneck_dim: 256

# Training
cv_folds: 5
# Canonical pair-to-fold assignments used by the completed benchmark runs.
# Every drug-response runner joins this manifest by (cell line, drug) identity
# and verifies the fingerprint before fitting or evaluating a model.
cv_fold_manifest_path: ${root_dir}/datasets/GDSC/drug_response_prediction_IC50_drug_resp_6e86893658933c75_cv_folds.csv
expected_cv_fold_fingerprint: f57411b49dbb865525cbf41f3b5975891654bbda63fee005dcec78fdb31996a8
epochs: 20
batch_size: 4
num_workers: 2
prefetch_factor: 2
grad_accumulation_steps: 4
head_learning_rate: 1e-4
backbone_learning_rate: 1e-4
max_grad_norm: 1e6
random_seed: 42

# Linear warm-up is measured in epochs but applied at every optimizer update.
min_lr: 1e-6
min_lr_ratio:
warmup_epochs: 2

# MLP baselines launched with task=finetune.drug_resp_raw_mlp. The expression
# variants concatenate raw expression with the fixed drug vector; drug_only
# excludes expression while retaining the same parameter target and training setup.
raw_mlp_feature_mode: all_genes  # all_genes | hvg1199 | drug_only
raw_mlp_variant:
raw_mlp_target_params: 6560000
raw_mlp_hidden_dim:
raw_mlp_standardize: true
raw_mlp_learning_rate: 1e-4

# Raw-expression PCA + random-forest regression baselines. PCA is fitted on
# distinct training-fold cell lines; cell components are concatenated with the
# fixed KPGT drug representation before fitting the regressor.
raw_pca_rf_feature_mode: all_genes  # all_genes | hvg1199
raw_pca_rf_variant:
raw_pca_rf_components: 256
raw_pca_rf_standardize: true
raw_pca_rf_whiten: false
raw_pca_rf_n_estimators: 500
raw_pca_rf_max_depth:
raw_pca_rf_min_samples_leaf: 1
raw_pca_rf_min_samples_split: 2
raw_pca_rf_max_features: sqrt
raw_pca_rf_bootstrap: true
raw_pca_rf_n_jobs: -1

# Frozen scbFM CLS embedding + PCA + random-forest regression.
pca_rf_variant:
pca_rf_components: 256
pca_rf_standardize: true
pca_rf_whiten: false
pca_rf_n_estimators: 500
pca_rf_max_depth:
pca_rf_min_samples_leaf: 1
pca_rf_min_samples_split: 2
pca_rf_max_features: sqrt
pca_rf_bootstrap: true
pca_rf_n_jobs: -1

# External BulkFormer-147M baseline. The full GDSC expression matrix is aligned
# to BulkFormer's 20,010-gene vocabulary and its max-pooled gene representation
# is combined with the same fixed KPGT drug vectors.
bulkformer_variant: bulkformer_pca_rf
bulkformer_repo_dir: ${root_dir}/other/BulkFormer
bulkformer_checkpoint_path: ${root_dir}/other/models/BulkFormer_147M.pt
bulkformer_expression_data_path: ${root_dir}/datasets/GDSC/drug_response_expr_data.csv
bulkformer_gene_info_path: ${root_dir}/other/BulkFormer/data/bulkformer_gene_info.csv
bulkformer_graph_path: ${root_dir}/other/BulkFormer/data/G_tcga.pt
bulkformer_graph_weight_path: ${root_dir}/other/BulkFormer/data/G_tcga_weight.pt
bulkformer_gene_emb_path: ${root_dir}/other/BulkFormer/data/esm2_feature_concat.pt
bulkformer_interested_gene_list_path: ${root_dir}/other/BulkFormer/data/interested_gene_list.pt
bulkformer_expected_gene_count: 20010
bulkformer_max_expected_expression: 30.0
bulkformer_batch_size: 4
bulkformer_aggregate_type: max  # paper-consistent benchmark setting
bulkformer_pca_components: 256
bulkformer_pca_standardize: true
bulkformer_pca_whiten: false
bulkformer_rf_n_estimators: 500
bulkformer_rf_max_depth:
bulkformer_rf_min_samples_leaf: 1
bulkformer_rf_min_samples_split: 2
bulkformer_rf_max_features: sqrt
bulkformer_rf_bootstrap: true
bulkformer_rf_n_jobs: -1

# External scGPT baseline. The canonical 13,004-gene GDSC matrix is mapped to
# the scGPT vocabulary before training-fold selection of 1,199 genes.
scgpt_variant: scgpt_pca_rf
scgpt_model_key: scgpt
scgpt_repo_dir: ${root_dir}/other/scGPT
scgpt_model_dir: ${root_dir}/other/models
scgpt_args_filename: scgpt_args.json
scgpt_vocab_filename: scgpt_vocab.json
scgpt_checkpoint_filename: scgpt_best_model.pt
scgpt_gene_info_path: ${repo_dir}/data/bulkformer_gene_info.csv
scgpt_expected_source_gene_count: 13004
scgpt_batch_size: 4
scgpt_max_seq_len: 1200
scgpt_use_fast_transformer: false
scgpt_pca_components: 256
scgpt_pca_standardize: true
scgpt_pca_whiten: false
scgpt_rf_n_estimators: 500
scgpt_rf_max_depth:
scgpt_rf_min_samples_leaf: 1
scgpt_rf_min_samples_split: 2
scgpt_rf_max_features: sqrt
scgpt_rf_bootstrap: true
scgpt_rf_n_jobs: -1
