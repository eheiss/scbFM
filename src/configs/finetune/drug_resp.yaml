# Pretrained model checkpoints (all four required)
pretrained_model_paths:
  pretrain_sc:
  pretrain_bulk:
  preadapt_sc:
  preadapt_bulk:

# Data paths
expression_data_path: /cluster/work/boeva/eheiss/datasets/GDSC/gdsc.h5ad
ic50_data_path: /cluster/work/boeva/eheiss/datasets/GDSC/drug_response_prediction_IC50.csv
drug_features_path: /cluster/work/boeva/eheiss/datasets/GDSC/drug_features.npz
gene_info_path:             # only needed when expression_data_path is a CSV; defaults to scbFM/data/bulkformer_gene_info.csv

# Column names in IC50 CSV
model_id_col: ModelID
drug_id_col: Drug ID
ic50_col: IC50
dataset_col: Dataset Version

# Raw values are aligned here; the selected 1,199-gene sequence is quantile-binned
# deterministically for each cell line.
gene_list_path: ../data/gene_list.txt
preprocess: true
# Fold-level HVGs are fitted on training cell lines and reused for all models.
hvg_flavor: cell_ranger

# Finetuning mode
finetune_mode: head_only       # head_only | adapters | full_ft
burn_in_epochs: 3
adapter_bottleneck_dim: 32
adapter_dropout: 0.0
adapter_learning_rate: 1.0e-4
adapter_after_attention: true
adapter_after_ff: true

# Fusion head: CancerFoundation CLS sample embedding concatenated with the KPGT
# drug embedding, then an MLP predicts IC50.
head_hidden_dim: 512
head_bottleneck_dim: 256

# Training
cv_folds: 5
epochs: 20
batch_size: 4
num_workers: 2
prefetch_factor: 2
grad_accumulation_steps: 4
head_learning_rate: 1.0e-4
backbone_learning_rate: 1.0e-4
max_grad_norm: 1.0e6
random_seed: 42

# Scheduler
first_cycle_steps: 20
cycle_mult: 1
min_lr: 1.0e-6
min_lr_ratio:
warmup_steps: 5
gamma: 1.0

# Raw-expression MLP baseline. Launched with task=finetune.drug_resp_raw_mlp.
# The model concatenates raw expression features with the drug feature vector.
raw_mlp_feature_mode: all_genes  # drug_only | all_genes | hvg1199
raw_mlp_variant:
raw_mlp_target_params: 6560000
raw_mlp_hidden_dim:
raw_mlp_hidden_layers: 2
raw_mlp_standardize: true
raw_mlp_learning_rate: 1e-4
