pretrained_model_paths:
  pretrain_sc:
  pretrain_bulk:
  preadapt_sc:
  preadapt_bulk:
tcga_data_dir:
gene_list_path: ../data/gene_list.txt

# BulkRNABert-style pan-cancer TCGA survival prediction on the same AnnData
# source used for TCGA cancer-type classification.
cohorts:
  - ACC
  - BLCA
  - BRCA
  - CESC
  - CHOL
  - COAD
  - DLBC
  - ESCA
  - GBM
  - HNSC
  - KICH
  - KIRC
  - KIRP
  - LAML
  - LGG
  - LIHC
  - LUAD
  - LUSC
  - MESO
  - OV
  - PAAD
  - PCPG
  - PRAD
  - READ
  - SARC
  - SKCM
  - STAD
  - TGCT
  - THCA
  - THYM
  - UCEC
  - UCS
  - UVM
merge_gbm_lgg: false
project_col: project
patient_col: patient_id
survival_event_col: OS
survival_time_col: OS.time
preprocess: true
min_genes: 200
hvg_flavor: cell_ranger
hvg_batch_key:

# Neural Cox head. Default uses CLS concatenated with mean-pooled gene tokens.
head_pooling: mean_cls
head_hidden_dim: 512
head_bottleneck_dim: 256
output_suffix: ""

finetune_mode: head_only       # head_only | adapters | full_ft
burn_in_epochs: 3
adapter_bottleneck_dim: 32
adapter_dropout: 0.0
adapter_learning_rate: 1e-4
adapter_after_attention: true
adapter_after_ff: true

cv_folds: 5
random_seed: 42
epochs: 30
batch_size: 4
num_workers: 2
prefetch_factor: 2
grad_accumulation_steps: 4
head_learning_rate: 1e-4
backbone_learning_rate: 1e-4
max_grad_norm: 1e6

first_cycle_steps: 30
cycle_mult: 1
min_lr: 1e-6
min_lr_ratio:
warmup_steps: 2
gamma: 1.0
