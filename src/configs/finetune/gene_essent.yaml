# Pretrained model checkpoints (all four required)
pretrained_model_paths:
  pretrain_sc:
  pretrain_bulk:
  preadapt_sc:
  preadapt_bulk:

# Combined DepMap h5ad (generated by data/notebooks/depmap.ipynb).
# Must contain layers 'expr_array' (expression) and 'essen_array' (CRISPR scores),
# with ENSG IDs as var_names.
depmap_data_path: /cluster/work/boeva/eheiss/datasets/DepMap/depmap.h5ad

# Data preprocessing (preprocess=true quantile-bins the expression values)
gene_list_path: ../data/gene_list.txt
preprocess: true
min_genes: 200

# Model architecture (must match the pretrained checkpoints)
bin_num: 10
gene_num: 11964
dim: 200
depth: 6
heads: 10
dim_head: 64
ff_mult: 4
nb_features:
feature_redraw_interval: 1000
ff_chunks: 1
ff_glu: false
emb_dropout: 0.
ff_dropout: 0.
attn_dropout: 0.
use_scalenorm: false
use_rezero: false
no_projection: false
tie_embed: false
g2v_position_emb: false
auto_check_redraw: true
qkv_bias: true

# Finetuning mode
finetune_mode: head_only       # head_only | adapters | full_ft
burn_in_epochs: 3
adapter_bottleneck_dim: 32
adapter_dropout: 0.0
adapter_learning_rate: 1e-4
adapter_after_attention: true
adapter_after_ff: true

# Regression head
head_hidden_dim: 128
head_dropout: 0.1

# Training
cv_folds: 5
epochs: 20
batch_size: 8
grad_accumulation_steps: 2
head_learning_rate: 1e-4
backbone_learning_rate: 1e-6
max_grad_norm: 1e6
random_seed: 42

# Scheduler
first_cycle_steps: 20
cycle_mult: 1
min_lr: 1e-6
min_lr_ratio:
warmup_steps: 5
gamma: 1.0
