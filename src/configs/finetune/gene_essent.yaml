# Pretrained model checkpoints (all four required)
pretrained_model_paths:
  pretrain_sc:
  pretrain_bulk:
  preadapt_sc:
  preadapt_bulk:

# Combined DepMap h5ad (generated by data/notebooks/depmap.ipynb).
# Must contain layers 'expr_array' (expression) and 'essen_array' (CRISPR scores),
# with ENSG IDs as var_names.
depmap_data_path: /cluster/work/boeva/eheiss/datasets/DepMap/depmap.h5ad

# Raw expression is aligned here; the selected 1,199-gene sequence is
# quantile-binned deterministically inside each DataLoader worker.
gene_list_path: ../data/gene_list.txt
preprocess: true
min_genes: 200
# HVGs are fitted on each training fold and reused for held-out samples and
# every compared checkpoint.
hvg_flavor: cell_ranger

# Finetuning mode
finetune_mode: head_only       # head_only | adapters | full_ft
burn_in_epochs: 3
adapter_bottleneck_dim: 32
adapter_dropout: 0.0
adapter_learning_rate: 1e-4
adapter_after_attention: true
adapter_after_ff: true

# Shared per-gene regression head. By default this preserves the plain
# per-gene setup: one CRISPR score from each contextualized gene embedding.
head_pooling: none
head_hidden_dim: 512
head_bottleneck_dim: 256
output_suffix: ""

# Training
cv_folds: 5
epochs: 20
batch_size: 8
num_workers: 2
prefetch_factor: 2
grad_accumulation_steps: 2
head_learning_rate: 1e-4
backbone_learning_rate: 1e-4
max_grad_norm: 1.0
random_seed: 42

# Scheduler
first_cycle_steps: 20
cycle_mult: 1
min_lr: 1e-6
min_lr_ratio:
warmup_steps: 5
gamma: 1.0

# Raw-expression MLP baseline. Launched with task=finetune.gene_essent_raw_mlp.
# It predicts the same fold-selected target genes as the transformer variants.
raw_mlp_feature_mode: all_genes  # all_genes | hvg1199
raw_mlp_variant:
raw_mlp_target_params: 6560000
raw_mlp_hidden_dim:
raw_mlp_hidden_layers: 2
raw_mlp_standardize: true
raw_mlp_learning_rate: 1e-4
