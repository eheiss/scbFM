pretrained_model_paths:
  pretrain_sc:
  pretrain_bulk:
  preadapt_sc:
  preadapt_bulk:
tcga_data_dir:
gene_list_path: ../data/gene_list.txt


cohorts: [BRCA, BLCA, GBM, LGG, LUAD, UCEC]
merge_gbm_lgg: true
preprocess: true
min_genes: 200
target_sum: 1e4
log_base: 2.0
cv_folds: 5
random_seed: 42

finetune_mode: head_only
burn_in_epochs: 3
adapter_bottleneck_dim: 32
adapter_dropout: 0.0
adapter_learning_rate: 1e-4
adapter_after_attention: true
adapter_after_ff: true
epochs: 20
batch_size: 4
grad_accumulation_steps: 3
head_learning_rate: 1e-4
backbone_learning_rate: 1e-6
max_grad_norm: 1e6

first_cycle_steps: 20
cycle_mult: 1
min_lr: 1e-6
min_lr_ratio:
warmup_steps: 2
gamma: 1.0
