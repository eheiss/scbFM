pretrained_model_paths:
  pretrain_sc:
  pretrain_bulk:
  preadapt_sc:
  preadapt_bulk:
pseudo_bulk_data_path:
preprocess: true
reindex_genes: true
gene_list_path: ../data/gene_list.txt
min_genes: 200
target_sum: 1e4

finetune_mode: head_only
burn_in_epochs: 3
adapter_bottleneck_dim: 32
adapter_dropout: 0.0
adapter_learning_rate: 1e-4
adapter_after_attention: true
adapter_after_ff: true
loss: kl

cv_folds: 10
split_by_context: true
context_columns: [dataset_id, donor_id, tissue_general]
random_seed: 42

epochs: 20
batch_size: 4
grad_accumulation_steps: 3
head_learning_rate: 1e-4
backbone_learning_rate: 1e-6
max_grad_norm: 1e6

head_hidden_dim: 128
head_dropout: 0.0

first_cycle_steps: 20
cycle_mult: 1
min_lr: 1e-6
min_lr_ratio:
warmup_steps: 2
gamma: 1.0
