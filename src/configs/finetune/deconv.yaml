pretrained_model_paths:
  pretrain_sc:
  pretrain_bulk:
  preadapt_sc:
  preadapt_bulk:
pseudo_bulk_data_path:
preprocess: true
gene_list_path: ../data/gene_list.txt
min_genes: 200
# Fold-level HVGs are fitted on training data and reused for training and
# evaluation. Their count comes from pretrain.selected_gene_count (1199).
hvg_flavor: cell_ranger
hvg_batch_key:
output_suffix: ""
# Deconvolution head input. Standard fine-tuning uses the concatenation of
# the CLS embedding and mean-pooled gene-token embeddings.
head_pooling: mean_cls
head_hidden_dim: 1024
head_bottleneck_dim: 1024

finetune_mode: head_only
burn_in_epochs: 3
adapter_bottleneck_dim: 32
adapter_dropout: 0.0
adapter_learning_rate: 1e-4
adapter_after_attention: true
adapter_after_ff: true
loss: kl

cv_folds: 5
split_by_context: true
context_columns: [dataset_id, donor_id, tissue_general]
random_seed: 42

epochs: 20
batch_size: 4
num_workers: 2
prefetch_factor: 2
grad_accumulation_steps: 4
head_learning_rate: 1e-4
backbone_learning_rate: 1e-4
max_grad_norm: 1e6

first_cycle_steps: 20
cycle_mult: 1
min_lr: 1e-6
min_lr_ratio:
warmup_steps: 2
gamma: 1.0

# Raw-expression MLP baseline. Launched with task=finetune.deconv_raw_mlp.
raw_mlp_feature_mode: all_genes  # all_genes | hvg1199
raw_mlp_variant:
raw_mlp_target_params: 6560000
raw_mlp_hidden_dim:
raw_mlp_hidden_layers: 2
raw_mlp_standardize: true
raw_mlp_learning_rate: 1e-4
