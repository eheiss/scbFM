pretrained_model_paths:
  pretrain_sc: ${output_dir}/pretrain_sc/pretrain_sc.pth
  pretrain_bulk: ${output_dir}/pretrain_bulk/pretrain_bulk.pth
  preadapt_sc: ${output_dir}/preadapt_sc/preadapt_sc.pth
  preadapt_bulk: ${output_dir}/preadapt_bulk/preadapt_bulk.pth
# Optional subset used by the pretraining-size head-only jobs.
model_keys:
pseudo_bulk_data_path: ${root_dir}/datasets/pseudo_bulk/pseudo_bulk_RAW.h5ad
preprocess: true
gene_list_path: ${repo_dir}/data/gene_list.txt
# Raw pseudobulk counts are log1p transformed after alignment. Fold-level
# genes are then selected on training data only and reused for evaluation.
hvg_selection_method: mad
output_suffix: ""
# Deconvolution head input uses the CancerFoundation CLS embedding.
head_hidden_dim: 512
head_bottleneck_dim: 256

finetune_mode: head_only
burn_in_epochs: 3
adapter_bottleneck_dim: 32
adapter_dropout: 0.0
adapter_learning_rate: 1e-4
adapter_after_attention: true
adapter_after_ff: true
# Optimize cell-type proportions on their original scale. MAE is the primary
# held-out metric; KL and Jensen-Shannon metrics remain diagnostic outputs.
loss: mse

cv_folds: 5
split_by_context: true
context_columns: [dataset_id, donor_id, tissue_general]
random_seed: 42
cv_fold_manifest_path: auto
# Reject the legacy fine-grained 829-target pseudobulk and audit the regenerated
# broad Cell Ontology target space before any model is initialized.
validate_broad_targets: true
expected_generator_schema_version: 2
min_target_cell_types: 15
max_target_cell_types: 30
min_active_cell_types: 2
max_active_cell_types: 8
# Assign complete dataset/donor/tissue contexts while balancing broad target
# presence and mass. The resulting manifest is shared by every runner.
balanced_group_folds: true
fold_balance_attempts: 64
require_target_in_each_test_fold: true

epochs: 20
batch_size: 4
num_workers: 2
prefetch_factor: 2
grad_accumulation_steps: 4
head_learning_rate: 1e-4
backbone_learning_rate: 1e-4
max_grad_norm: 1e6

min_lr: 1e-6
min_lr_ratio:
# Linear warm-up is measured in epochs and applied per optimizer update.
warmup_epochs: 2

# Raw-expression MLP baseline. Launched with task=finetune.deconv_raw_mlp.
raw_mlp_feature_mode: all_genes  # all_genes | hvg1199
raw_mlp_variant:
raw_mlp_target_params: 6560000
raw_mlp_hidden_dim:
raw_mlp_hidden_layers: 2
raw_mlp_standardize: true
raw_mlp_learning_rate: 1e-4

# Raw-expression PCA + multi-output random forest.
raw_pca_rf_feature_mode: all_genes  # all_genes | hvg1199
raw_pca_rf_variant:
raw_pca_rf_components: 256
raw_pca_rf_standardize: true
raw_pca_rf_whiten: false
raw_pca_rf_n_estimators: 500
raw_pca_rf_max_depth:
raw_pca_rf_min_samples_leaf: 1
raw_pca_rf_min_samples_split: 2
raw_pca_rf_max_features: sqrt
raw_pca_rf_bootstrap: true
raw_pca_rf_n_jobs: -1

# Frozen scbFM CLS embeddings + PCA + multi-output random forest.
pca_rf_variant: pca_rf
pca_rf_components: 256
pca_rf_standardize: true
pca_rf_whiten: false
pca_rf_n_estimators: 500
pca_rf_max_depth:
pca_rf_min_samples_leaf: 1
pca_rf_min_samples_split: 2
pca_rf_max_features: sqrt
pca_rf_bootstrap: true
pca_rf_n_jobs: -1

# External BulkFormer embeddings + PCA + multi-output random forest. The
# 13,004-gene pseudobulk matrix is aligned to the 20,010-gene vocabulary and
# unavailable genes are filled with BulkFormer's sentinel value.
bulkformer_variant: bulkformer_pca_rf
bulkformer_repo_dir: ${root_dir}/other/BulkFormer
bulkformer_checkpoint_path: ${root_dir}/other/models/BulkFormer_147M.pt
bulkformer_gene_info_path: ${root_dir}/other/BulkFormer/data/bulkformer_gene_info.csv
bulkformer_graph_path: ${root_dir}/other/BulkFormer/data/G_tcga.pt
bulkformer_graph_weight_path: ${root_dir}/other/BulkFormer/data/G_tcga_weight.pt
bulkformer_gene_emb_path: ${root_dir}/other/BulkFormer/data/esm2_feature_concat.pt
bulkformer_interested_gene_list_path: ${root_dir}/other/BulkFormer/data/interested_gene_list.pt
bulkformer_expected_gene_count: 20010
bulkformer_max_expected_expression: 30.0
bulkformer_batch_size: 4
bulkformer_aggregate_type: max
bulkformer_pca_components: 256
bulkformer_pca_standardize: true
bulkformer_pca_whiten: false
bulkformer_rf_n_estimators: 500
bulkformer_rf_max_depth:
bulkformer_rf_min_samples_leaf: 1
bulkformer_rf_min_samples_split: 2
bulkformer_rf_max_features: sqrt
bulkformer_rf_bootstrap: true
bulkformer_rf_n_jobs: -1

# External scGPT CLS embeddings + PCA + multi-output random forest.
scgpt_variant: scgpt_pca_rf
scgpt_model_key: scgpt
scgpt_repo_dir: ${root_dir}/other/scGPT
scgpt_model_dir: ${root_dir}/other/models
scgpt_args_filename: args.json
scgpt_vocab_filename: vocab.json
scgpt_checkpoint_filename: best_model.pt
scgpt_gene_info_path: ${repo_dir}/data/bulkformer_gene_info.csv
scgpt_expected_source_gene_count: 13004
scgpt_batch_size: 4
scgpt_max_seq_len: 1200
scgpt_use_fast_transformer: false
scgpt_pca_components: 256
scgpt_pca_standardize: true
scgpt_pca_whiten: false
scgpt_rf_n_estimators: 500
scgpt_rf_max_depth:
scgpt_rf_min_samples_leaf: 1
scgpt_rf_min_samples_split: 2
scgpt_rf_max_features: sqrt
scgpt_rf_bootstrap: true
scgpt_rf_n_jobs: -1
