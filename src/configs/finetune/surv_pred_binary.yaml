pretrained_model_paths:
  pretrain_sc:
  pretrain_bulk:
  preadapt_sc:
  preadapt_bulk:
tcga_data_dir:
gene_list_path: ../data/gene_list.txt

# Same TCGA AnnData source as cancer type classification, but defaulting to
# the 33 TCGA cancer cohorts used for BulkFormer prognosis modeling.
cohorts:
  - ACC
  - BLCA
  - BRCA
  - CESC
  - CHOL
  - COAD
  - DLBC
  - ESCA
  - GBM
  - HNSC
  - KICH
  - KIRC
  - KIRP
  - LAML
  - LGG
  - LIHC
  - LUAD
  - LUSC
  - MESO
  - OV
  - PAAD
  - PCPG
  - PRAD
  - READ
  - SARC
  - SKCM
  - STAD
  - TGCT
  - THCA
  - THYM
  - UCEC
  - UCS
  - UVM
merge_gbm_lgg: false
preprocess: true
hvg_flavor: cell_ranger
hvg_batch_key:

# BulkFormer-style binary prognosis endpoint for AUROC comparison:
# classify OS event/status directly, 1 = event/deceased, 0 = censored/alive.
survival_event_col: OS
survival_time_col: OS.time

# Binary survival head uses the CancerFoundation CLS embedding.
cv_folds: 5
random_seed: 42

finetune_mode: head_only
output_suffix: ""
burn_in_epochs: 3
adapter_bottleneck_dim: 32
adapter_dropout: 0.0
adapter_learning_rate: 1e-4
adapter_after_attention: true
adapter_after_ff: true
epochs: 20
batch_size: 4
num_workers: 2
prefetch_factor: 2
grad_accumulation_steps: 4
class_weight_power: 1.0
head_hidden_dim: 512
head_bottleneck_dim: 256
head_learning_rate: 1e-4
backbone_learning_rate: 1e-4
max_grad_norm: 1e6

first_cycle_steps: 20
cycle_mult: 1
min_lr: 1e-6
min_lr_ratio:
warmup_steps: 2
gamma: 1.0

# Raw-expression MLP baseline. Launched with task=finetune.surv_pred_binary_raw_mlp.
raw_mlp_feature_mode: all_genes  # all_genes | hvg1199
raw_mlp_variant:
raw_mlp_target_params: 6560000
raw_mlp_hidden_dim:
raw_mlp_hidden_layers: 2
raw_mlp_standardize: true
raw_mlp_learning_rate: 1e-4
