pretrained_model_paths:
  pretrain_sc:
  pretrain_bulk:
  preadapt_sc:
  preadapt_bulk:
tcga_data_dir:
gene_list_path: ../data/gene_list.txt

cohorts:
  - ACC
  - BLCA
  - BRCA
  - CESC
  - CHOL
  - COAD
  - DLBC
  - ESCA
  - GBM
  - HNSC
  - KICH
  - KIRC
  - KIRP
  - LAML
  - LGG
  - LIHC
  - LUAD
  - LUSC
  - MESO
  - OV
  - PAAD
  - PCPG
  - PRAD
  - READ
  - SARC
  - SKCM
  - STAD
  - TGCT
  - THCA
  - THYM
  - UCEC
  - UCS
  - UVM
merge_gbm_lgg: false
preprocess: true
min_genes: 200
# Fold-level HVGs are fitted on training data and reused for training and
# evaluation. Their count comes from pretrain.selected_gene_count (1199).
hvg_flavor: cell_ranger
hvg_batch_key:
# Use the CancerFoundation CLS embedding plus mean-pooled gene embeddings as
# input to the classification MLP.
use_cls: true
head_pooling: mean_cls
# Slightly larger classification head for the harder 33-class task:
# 2 * embsize -> 512 -> 256 -> n_classes.
head_hidden_dim: 512
head_bottleneck_dim: 256
cv_folds: 5
random_seed: 42

finetune_mode: head_only
burn_in_epochs: 3
adapter_bottleneck_dim: 32
adapter_dropout: 0.0
adapter_learning_rate: 1e-4
adapter_after_attention: true
adapter_after_ff: true
epochs: 20
batch_size: 4
num_workers: 2
prefetch_factor: 2
grad_accumulation_steps: 4
# 1.0 uses inverse-frequency balanced cross-entropy.
class_weight_power: 1.0
head_learning_rate: 1e-4
backbone_learning_rate: 1e-4
max_grad_norm: 1e6

first_cycle_steps: 20
cycle_mult: 1
min_lr: 1e-6
min_lr_ratio:
warmup_steps: 2
gamma: 1.0

# Raw-expression MLP baseline. Launched with
# task=finetune.canc_type_class_33_raw_mlp.
raw_mlp_feature_mode: all_genes  # all_genes | hvg1199
raw_mlp_variant:
raw_mlp_target_params: 6560000
raw_mlp_hidden_dim:
raw_mlp_hidden_layers: 2
raw_mlp_standardize: true
raw_mlp_learning_rate: 1e-4

# Backbone-embedding PCA + random-forest baseline. Launched with
# task=finetune.canc_type_class_33_pca_rf.
pca_rf_variant:
pca_rf_pooling: mean_cls
pca_rf_components: 256
pca_rf_standardize: true
pca_rf_whiten: false
pca_rf_n_estimators: 500
pca_rf_max_depth:
pca_rf_min_samples_leaf: 1
pca_rf_min_samples_split: 2
pca_rf_max_features: sqrt
pca_rf_class_weight: balanced
pca_rf_bootstrap: true
pca_rf_n_jobs: -1
