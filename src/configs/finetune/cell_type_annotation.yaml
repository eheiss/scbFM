# scGPT zero-shot reference mapping. No query labels are used for gene
# selection, model fitting, checkpoint selection, or nearest-neighbor fitting.
datasets:
  covid19:
    display_name: COVID-19
    reference_path: ${root_dir}/datasets/scgpt_single_cell/covid/batch_covid_subsampled_train.h5ad
    query_path: ${root_dir}/datasets/scgpt_single_cell/covid/batch_covid_subsampled_test.h5ad
    gene_key: gene_name
    label_key: celltype
    batch_key: str_batch
    preprocessing: none
    expected_reference_cells: 15997
    expected_query_cells: 4003
    expected_total_cells: 20000
    expected_batch_count: 18
  lung_kim:
    display_name: Lung-Kim
    reference_path: ${root_dir}/datasets/scgpt_single_cell/lung/sample_proc_lung_train.h5ad
    query_path: ${root_dir}/datasets/scgpt_single_cell/lung/sample_proc_lung_test.h5ad
    gene_key: gene_name
    label_key: cell_type
    batch_key: sample
    preprocessing: normalize_log1p
    expected_reference_cells:
    expected_query_cells:
    expected_total_cells: 30472
    expected_batch_count: 14
dataset_keys: [covid19, lung_kim]

gene_list_path: ${repo_dir}/data/gene_list.txt
gene_info_path: ${repo_dir}/data/bulkformer_gene_info.csv
gene_selection_method: mad

pretrained_model_paths:
  pretrain_sc: ${output_dir}/pretrain_sc/pretrain_sc.pth
  pretrain_bulk: ${output_dir}/pretrain_bulk/pretrain_bulk.pth
  preadapt_sc: ${output_dir}/preadapt_sc/preadapt_sc.pth
  preadapt_bulk: ${output_dir}/preadapt_bulk/preadapt_bulk.pth
model_keys:

include_external_scgpt: true
scgpt_repo_dir: ${root_dir}/other/scGPT
external_scgpt_models:
  scgpt:
    model_dir: ${root_dir}/other/models
    args_filename: scgpt_args.json
    vocab_filename: scgpt_vocab.json
    checkpoint_filename: scgpt_best_model.pt
  scgpt_preadapt:
    model_dir: ${output_dir}/scgpt_preadapt
    args_filename: args.json
    vocab_filename: vocab.json
    checkpoint_filename: last_model.pt

output_variant: zero_shot_scgpt
n_neighbors: 10
batch_size: 4
scgpt_batch_size: 4
min_external_scgpt_gene_coverage: 0.9
num_workers: 2
random_seed: 42
distributed_timeout_minutes: 360
include_raw_pca: true
raw_pca_components: 256
