# Native scGPT continued pretraining on the complete leakage-filtered bulk corpus.
model_name: scgpt_preadapt
data_paths: []

scgpt_repo_dir: ${root_dir}/other/scGPT
scgpt_model_dir: ${root_dir}/other/models
scgpt_args_filename: args.json
scgpt_vocab_filename: vocab.json
scgpt_checkpoint_filename: best_model.pt
gene_info_path: ${repo_dir}/data/bulkformer_gene_info.csv

# The audit performs all compatibility and data checks without optimization.
audit_only: false
audit_sample_rows: 128

# Native scGPT input contract: retain vocabulary-matched genes with non-zero
# expression per profile; sample at most 1,199 and preserve CLS at position zero.
max_seq_len: 1200
input_gene_filter: nonzero_per_profile
expected_source_gene_count: 13004
n_bins: 51
mask_ratio: 0.4
validation_split: 0.05
seed: 2021
min_mapped_genes: 1199

# Continued pretraining objectives. MVC directly supervises the CLS embedding.
do_mvc: true
mvc_loss_weight: 1.0
use_fast_transformer: false

# Four GPUs x 4 samples x 4 accumulated microbatches = effective batch size 64.
epochs: 10
batch_size: 4
grad_acc: 4
num_workers: 2
prefetch_factor: 2
max_grad_norm: 1.0
amp: true
amp_dtype: auto

backbone_learning_rate: 1e-5
new_module_learning_rate: 5e-5
weight_decay: 0.01
adam_eps: 1e-8
warmup_fraction: 0.05
min_lr_ratio: 0.01

valid_every: 1
# Validation is monitoring-only; train through the prescribed final epoch.
early_stopping_patience: 0
early_stopping_min_delta: 1e-4
log_every_batches: 250

# Optional complete training-state checkpoint. The native source checkpoint is
# always loaded first and remains separate from this resume state.
resume_state_path:
