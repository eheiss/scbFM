# paths
model_name:
data_path:
resume_checkpoint: null
resume_optimizer_state: true

# training
epochs: 5
batch_size: 16
valid_every: 1
grad_acc: 4
max_grad_norm: 1e2

# CancerFoundation/scGPT-style expression bins:
# bin 0 is zero expression, bins 1..50 are nonzero quantile bins.
bin_num: 51
gene_num: 13004
selected_gene_count: 1199
max_seq_len: 1200
seed: 2021
embsize: 256
nlayers: 6
nheads: 8
d_hid: 512
dropout: 0.2
value_encoder_max_value: 512
pad_value: -2.0
mask_value: -1.0

# data
preprocess: false
reindex_genes: true
gene_list_path: ../data/gene_list.txt
min_genes: 200
validation_split: 0.05
mask_prob: 0.15
mask_ignore_values: []
exclude_masked_from_attention: true
# CancerFoundation-style hybrid input sampling. The runner requests this
# expressed/zero split per sample and fills deficits from the remaining genes.
hybrid_gene_sampling: true
expressed_gene_fraction: 0.5

# loss
# MSE over masked binned expression values, matching scGPT/CancerFoundation.
loss_type: mse
# Additional CancerFoundation-style objective:
# MLP(h_cls || emb_gene(masked_gene)) predicts the same masked binned value.
# Technology embeddings are intentionally omitted because this dataset has no
# stable technology/domain label in the pretraining runner.
cls_loss_weight: 1.0

#optimizer
learning_rate: 1e-4
first_cycle_steps: 5
cycle_mult: 1
min_lr: 1e-6
warmup_steps: 1
gamma: 1.0
