# paths
model_name:
data_path:
resume_checkpoint: null

# training
epochs: 5
batch_size: 4
valid_every: 1
grad_acc: 4
max_grad_norm: 1e2

# model
bin_num: 10
gene_num: 11964
seed: 2021
dim: 200
depth: 6
heads: 10
dim_head: 64
ff_mult: 4
nb_features: null
feature_redraw_interval: 1000
ff_chunks: 1
ff_glu: False
emb_dropout: 0.
ff_dropout: 0.
attn_dropout: 0.
use_scalenorm: False
use_rezero: False
no_projection: False
tie_embed: False
g2v_position_emb: False
auto_check_redraw: True
qkv_bias: True

# data
preprocess: true
reindex_genes: true
gene_list_path: ../data/gene_list.txt
min_genes: 200
validation_split: 0.05
mask_prob: 0.15
replace_prob: 0.9
random_token_prob: 0.
mask_ignore_token_ids: [0]

# loss
loss_type: ce  # "ce" (cross-entropy) or "mse" (ordinal MSE over bin soft-predictions; also enables scGPT-style embx)

#optimizer
learning_rate: 1e-4
first_cycle_steps: 5
cycle_mult: 1
min_lr: 1e-6
warmup_steps: 1
gamma: 1.0

